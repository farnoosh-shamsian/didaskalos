<!DOCTYPE html>
<!-- Landing page for a session closed by the idle watcher (see idle_timeout.py), static and self-contained on purpose: one plain HTTP request, no websocket and no external fetches, so reaching it keeps no Cloud Run instance alive, and both languages are inlined because a static file cannot read the app's locale JSON. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Didaskalos</title>
<style>
  /* Both palettes match [theme.light] / [theme.dark] in .streamlit/config.toml.
     The app appends ?theme= when it sends a timed-out tab here, so this page
     looks like the one the visitor left. Light is the default, as in the app. */
  :root {
    --page: #cdc6b6;
    --card: #dad4c8;
    --border: #5c5545;
    --text: #1f1c16;
    --heading: #530707;
    --accent: #3a1712;
    --on-accent: #cacbc4;
    --card-shadow: rgba(31, 28, 22, 0.12);
  }
  :root[data-theme="dark"] {
    --page: #181310;
    --card: #362923;
    --border: #8e705c;
    --text: #e7ded0;
    --heading: #e0b68a;
    --accent: #d4a87a;
    --on-accent: #181310;
    --card-shadow: rgba(0, 0, 0, 0.4);
  }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--page);
    color: var(--text);
    font-family: 'Source Sans Pro', 'Segoe UI', sans-serif;
    line-height: 1.6;
  }
  body[dir="rtl"] {
    font-family: 'Noto Naskh Arabic', 'B Lotus', Tahoma, sans-serif;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 40px 44px;
    max-width: 460px;
    text-align: center;
    box-shadow: 0 4px 24px var(--card-shadow);
  }
  h1 { margin: 0 0 14px; font-size: 1.5rem; color: var(--heading); }
  p { margin: 0 0 26px; font-size: 1.05rem; }
  a.restart {
    display: inline-block;
    background: var(--accent);
    color: var(--on-accent);
    text-decoration: none;
    border-radius: 8px;
    padding: 11px 26px;
    font-size: 1rem;
  }
</style>
</head>
<body>
<div class="card">
  <h1 id="title"></h1>
  <p id="body"></p>
  <a class="restart" id="restart" href="/"></a>
</div>
<script>
  var TEXT = {
    en: {
      title: "Session closed",
      body: "This session was closed after a period of inactivity, so the server could shut down. Nothing was lost — start again whenever you like.",
      restart: "Start again",
      dir: "ltr"
    },
    fa: {
      title: "نشست بسته شد",
      body: "این نشست پس از مدتی بی‌استفاده ماندن بسته شد تا سرور خاموش شود. چیزی از دست نرفته — هر وقت خواستید دوباره شروع کنید.",
      restart: "شروع دوباره",
      dir: "rtl"
    }
  };

  var params = new URLSearchParams(window.location.search);
  var lang = params.get("lang");
  var theme = params.get("theme") === "dark" ? "dark" : "light";
  var text = TEXT[lang] || TEXT.en;

  document.documentElement.setAttribute("data-theme", theme);
  document.documentElement.lang = TEXT[lang] ? lang : "en";
  document.body.setAttribute("dir", text.dir);
  document.getElementById("title").textContent = text.title;
  document.getElementById("body").textContent = text.body;

  var restart = document.getElementById("restart");
  restart.textContent = text.restart;
  // Send them back into the app in the language and theme they were using.
  var back = new URLSearchParams({ theme: theme });
  if (TEXT[lang]) { back.set("lang", lang); }
  restart.href = "/?" + back.toString();
</script>
</body>
</html>
