# Two custom palettes rather than one, because defining [theme.light] and [theme.dark] is what makes Streamlit offer an appearance choice at all, so every colour lives in one of the two sections below; the colours are the project site's own (docs/assets/styles.css) so the app and the page it is linked from read as one thing, sand ground and deep red on light and the logo's gold on near-black brown on dark, with a saturated red only ever text or a small filled surface and giving way to the gold entirely on dark; borderColor is far darker than its ground on purpose, being the only thing marking where an input begins, and a hairline tinted to match the sand disappears for anyone reading with reduced contrast sensitivity.
[theme]
font = "sans-serif"

[theme.light]
primaryColor = "#3a1712"
backgroundColor = "#cdc6b6"
secondaryBackgroundColor = "#b7af9f"
textColor = "#1f1c16"
linkColor = "#530707"
borderColor = "#5c5545"
codeBackgroundColor = "#dad4c8"
dataframeHeaderBackgroundColor = "#b7af9f"

[theme.dark]
primaryColor = "#d4a87a"
backgroundColor = "#181310"
secondaryBackgroundColor = "#362923"
textColor = "#e7ded0"
linkColor = "#e0b68a"
borderColor = "#8e705c"
codeBackgroundColor = "#362923"
dataframeHeaderBackgroundColor = "#362923"

[server]
headless = true
port = 8080
enableCORS = false
# Serves ./static/ at /app/static/, so the idle watcher's static/session-ended.html is reachable without opening a Streamlit session, which is the whole point of sending timed-out tabs there.
enableStaticServing = true
